name: Java Spring Boot CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-project:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your source code onto the GitHub server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java and automatically cache Gradle dependencies
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # 👈 This saves your dependencies so next builds are super fast!

      # Step 3: Give permission to run the Gradle wrapper script
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Step 4: Build the application without running tests
      - name: Build with Gradle
        run: ./gradlew build -x test  # 👈 "-x test" explicitly tells Gradle to skip testing
